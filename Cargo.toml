[workspace]
members = ["tools/netflow-db"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Keep production binaries optimized across crate boundaries. The profiling
# profile preserves line information without changing release optimization.
[profile.release]
codegen-units = 1
lto = "thin"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"

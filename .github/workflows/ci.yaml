name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    name: Web + Pipeline Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - run: cp datasets.json.example datasets.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: rustup show

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-toolchains-${{ hashFiles('bun.lock', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-toolchains-

      - run: bun install --frozen-lockfile

      - run: bun run format:check

      - run: bun run check:web

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run test:web

      - run: bun run test:db

      - run: bun run build:web

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: unit-and-build
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - run: cp datasets.json.example datasets.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - run: bun install --frozen-lockfile

      - run: bun run build:web

      - run: cd apps/web && bunx playwright install --with-deps chromium

      - run: cd apps/web && PLAYWRIGHT_WEB_SERVER=1 bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

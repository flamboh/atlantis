name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - run: cp datasets.json.example datasets.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Check formatting
        run: bunx prettier --check .

      - name: Check Svelte
        run: bun run check:web

      - name: Lint
        run: bun run --cwd apps/web lint

      - name: Typecheck
        run: bun run --cwd apps/web typecheck

      - name: Test
        run: bun run test:web

      - name: Build
        run: bun run build:web

  pipeline:
    name: Rust Pipeline Checks
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Typecheck
        run: cargo check --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --all-features --locked

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v6

      - run: cp datasets.json.example datasets.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - run: bun install --frozen-lockfile

      - run: bun run build:web

      - run: cd apps/web && bunx playwright install --with-deps chromium

      - run: cd apps/web && PLAYWRIGHT_WEB_SERVER=1 bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

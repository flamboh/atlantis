[package]
name = "atlantis-netflow-db"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "netflow_db"
path = "src/lib.rs"

[[bin]]
name = "netflow-db"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arrow-array = "59.2"
arrow-schema = "59.2"
clap = { version = "4", features = ["derive"] }
command-group = "5"
csv = "1"
fixedbitset = "0.5"
flate2 = "1"
fs2 = "0.4"
ipnet = { version = "2", features = ["serde"] }
jiff = "0.2"
libc = "0.2"
nix = { version = "0.27", default-features = false, features = ["fs"] }
parquet = { version = "59.2", default-features = false, features = ["arrow", "zstd"] }
rayon = "1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rusqlite = { version = "0.38", features = ["backup", "bundled"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[lints]
workspace = true
